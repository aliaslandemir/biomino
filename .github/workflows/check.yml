name: Check map

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate snapshot and builder
        run: python -m unittest discover -s test -v
      - name: Verify generated pages are current
        run: |
          python main.py
          git diff --exit-code -- BiomiNO_map.html docs/index.html
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check browser behavior
        run: npm test
